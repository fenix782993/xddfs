services:
  - type: web
    name: fenix-coin-ultra
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.web:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fenix-coin-ultra-db
          property: connectionString
      - key: ADMIN_IDS
        sync: false
      - key: ADMIN_CHANNEL_ID
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: REF_REWARD
        value: "600"
      - key: START_BALANCE
        value: "1000"
databases:
  - name: fenix-coin-ultra-db
    plan: free
    databaseName: fenixcoin
    user: fenix
